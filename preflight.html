<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Noto Sans KR","Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;color:#1d1d1f;background:#f5f5f7;display:flex;align-items:center;justify-content:center;padding:24px}
.wrap{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:28px;text-align:center}
.brand{font-size:15px;font-weight:500;color:#6e6e73}
h1{margin:0;font-size:40px;line-height:1.1;font-weight:900;letter-spacing:-0.03em}
.note{background:#ffe66b;width:100%;padding:32px 28px 26px;transform:rotate(-1.2deg);box-shadow:0 24px 48px rgba(90,80,20,.14);display:flex;flex-direction:column;gap:14px;text-align:left}
.note label{font-size:15px;font-weight:700}
.note input[type=password]{text-transform:lowercase;width:100%;font:inherit;font-size:18px;padding:14px 16px;border:0;border-radius:10px;background:#fff;color:#1d1d1f;outline:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.note input[type=password]:focus{box-shadow:inset 0 0 0 2px #1d1d1f}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.remember{display:flex;align-items:center;gap:8px;font-size:14px;color:#3a3a3c;cursor:pointer}
.remember input{width:18px;height:18px;accent-color:#1d1d1f;margin:0}
button{font:inherit;font-size:16px;font-weight:700;border:0;border-radius:999px;background:#1d1d1f;color:#fff;padding:12px 24px;cursor:pointer;min-height:44px}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,.remember input:focus-visible{outline:2px solid #1d1d1f;outline-offset:3px}
.msg{min-height:20px;font-size:14px;color:#b3261e;font-weight:500}
.sub{font-size:14px;color:#86868b;line-height:1.6}
.opening{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;color:#6e6e73;font-size:15px;background:#f5f5f7}
.opening[hidden],#gate[hidden]{display:none}
.dot{width:10px;height:10px;border-radius:50%;background:#ffe66b;animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.note{transform:none}.dot{animation:none}}
</style>
</head>
<body>
<div class="opening" id="opening" hidden><span class="dot"></span>여는 중</div>
<main class="wrap" id="gate" hidden>
  <div class="brand">KDS Studio</div>
  <h1>팀 안에서만<br>봅니다.</h1>
  <form class="note" id="f" autocomplete="off">
    <label for="pw">비밀번호</label>
    <input type="password" id="pw" autofocus required aria-describedby="msg" autocapitalize="none" autocorrect="off" spellcheck="false">
    <div class="row">
      <label class="remember"><input type="checkbox" id="rm" checked>이 기기에서 30일 기억하기</label>
      <button type="submit" id="go">열기</button>
    </div>
    <div class="msg" id="msg" role="alert"></div>
  </form>
  <div class="sub">비밀번호는 KDS Studio 담당자에게 물어보세요.</div>
</main>

var KEY = "kds-studio-key-v2"; var DAYS = 30;
try{ localStorage.removeItem("kds-studio-key-v1"); }catch(_){}
function norm(p){ return p.trim().toLowerCase().replace(/[_-]/g," ").split(/\s+/).filter(Boolean).join("-"); }
function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function tob64(buf){var a=new Uint8Array(buf),s="";for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);}
async function deriveRaw(pw){
  var out = await hashwasm.argon2id({password: norm(pw), salt: b64(P.s), parallelism: P.p, iterations: P.t, memorySize: P.m, hashLength: 32, outputType: "binary"});
  return out.buffer.slice(out.byteOffset, out.byteOffset + out.byteLength);
}
async function openWith(raw, toTop){
  var key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  var plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(P.i)}, key, b64(P.c));
  var html = new TextDecoder().decode(plain);
  if (document.readyState !== "complete") await new Promise(function(r){ window.addEventListener("load", r, {once:true}); });
  document.open(); document.write(html); document.close();
  if (toTop) {
    try { history.scrollRestoration = "manual"; } catch(_){}
    if (location.hash) { try { history.replaceState(null, "", location.pathname + location.search); } catch(_){} }
    var top = function(){ window.scrollTo(0, 0); };
    top(); requestAnimationFrame(top); setTimeout(top, 60); window.addEventListener("load", top, {once:true});
  }
}
(async function(){
  var saved=null; try{ var j = JSON.parse(localStorage.getItem(KEY)||"null"); if(j && j.k && j.e > Date.now()) saved = j.k; else localStorage.removeItem(KEY); }catch(e){}
  if(saved){
    document.getElementById("opening").hidden=false;
    try{ await openWith(b64(saved)); return; }catch(e){ try{localStorage.removeItem(KEY);}catch(_){} }
    document.getElementById("opening").hidden=true;
  }
  document.getElementById("gate").hidden=false;
  var i=document.getElementById("pw"); if(i) i.focus();
})();
document.getElementById("f").addEventListener("submit", async function(e){
  e.preventDefault();
  var btn=document.getElementById("go"), msg=document.getElementById("msg"), pw=document.getElementById("pw").value;
  msg.textContent=""; btn.disabled=true; btn.textContent="여는 중…";
  try{
    var raw = await deriveRaw(pw);
    if(document.getElementById("rm").checked){ try{ localStorage.setItem(KEY, JSON.stringify({k: tob64(raw), e: Date.now() + DAYS*86400000})); }catch(_){} }
    await openWith(raw, true);
  }catch(err){
    msg.textContent="비밀번호가 맞지 않아요. 다시 입력해 주세요.";
    btn.disabled=false; btn.textContent="열기";
    var i=document.getElementById("pw"); i.select(); i.focus();
  }
});
